<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0C1B" />
      <stop offset="50%" stop-color="#18122B" />
      <stop offset="100%" stop-color="#0A0612" />
    </linearGradient>
    
    <radialGradient id="glow1" cx="300" cy="250" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="900" cy="400" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad1" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#261C3D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1A132C" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#311F4E" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E1433" stop-opacity="0.85" />
    </linearGradient>

    <filter id="shadow" x="-20" y="-20" width="500" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Subtle Grid Dots -->
  <pattern id="gridDots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.2" fill="#8B5CF6" fill-opacity="0.15" />
  </pattern>
  <rect width="1200" height="630" fill="url(#gridDots)" />

  <!-- Abstract Intersecting Connection Wave -->
  <path d="M 150 480 C 350 480, 450 220, 600 220 C 750 220, 850 480, 1050 480" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6" />
  <path d="M 150 440 C 350 440, 450 180, 600 180 C 750 180, 850 440, 1050 440" stroke="#A78BFA" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Left Card: Practice Speaker -->
  <g transform="translate(180, 140)" filter="url(#shadow)">
    <rect width="420" height="260" rx="20" fill="url(#cardGrad1)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Card Header -->
    <circle cx="36" cy="36" r="14" fill="#8B5CF6" fill-opacity="0.2" />
    <circle cx="36" cy="36" r="6" fill="#A78BFA" />
    <text x="62" y="41" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">ROLE: SPEAKER</text>
    <rect x="310" y="24" width="84" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.15" border="1px solid #8B5CF6" />
    <text x="325" y="40" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">PAUSED</text>

    <!-- Message Bubble -->
    <rect x="36" y="80" width="348" height="90" rx="14" fill="#150E24" stroke="#8B5CF6" stroke-opacity="0.2" />
    <text x="56" y="112" fill="#F3E8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400">"I wanted to talk about what happened</text>
    <text x="56" y="136" fill="#F3E8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400">yesterday. It made me feel unheard."</text>

    <!-- Optional Prompt Widget -->
    <rect x="36" y="190" width="348" height="42" rx="10" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.4" stroke-dasharray="4 4" />
    <text x="54" y="216" fill="#D8B4FE" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">✦ Optional Prompt: Reframe with 'When you...'</text>
  </g>

  <!-- Right Card: Practice Partner & Mutual Debrief -->
  <g transform="translate(600, 220)" filter="url(#shadow)">
    <rect width="420" height="270" rx="20" fill="url(#cardGrad2)" stroke="#EC4899" stroke-opacity="0.35" stroke-width="1.5" />
    
    <!-- Card Header -->
    <circle cx="36" cy="36" r="14" fill="#EC4899" fill-opacity="0.2" />
    <circle cx="36" cy="36" r="6" fill="#F472B6" />
    <text x="62" y="41" fill="#FCE7F3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">ROLE: LISTENER / PARTNER</text>
    <rect x="300" y="24" width="94" height="24" rx="12" fill="#EC4899" fill-opacity="0.15" />
    <text x="312" y="40" fill="#FBCFE8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">SAFE ROOM</text>

    <!-- Message Bubble -->
    <rect x="36" y="80" width="348" height="90" rx="14" fill="#1C1029" stroke="#EC4899" stroke-opacity="0.2" />
    <text x="56" y="112" fill="#FDF2F8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400">"Thank you for sharing that. I didn't</text>
    <text x="56" y="136" fill="#FDF2F8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400">realize it landed that way. Tell me more."</text>

    <!-- Mutual Reflection Tag -->
    <rect x="36" y="192" width="348" height="50" rx="12" fill="#2A173B" stroke="#F472B6" stroke-opacity="0.3" />
    <circle cx="58" cy="217" r="8" fill="#EC4899" />
    <text x="76" y="214" fill="#FCE7F3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">MUTUAL DEBRIEF ACTIVE</text>
    <text x="76" y="230" fill="#FBCFE8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-style="italic">Reflections are private by default</text>
  </g>

  <!-- Center Floating Tag -->
  <g transform="translate(480, 90)">
    <rect width="240" height="42" rx="21" fill="#0F091A" stroke="#A78BFA" stroke-width="1.5" />
    <text x="120" y="26" text-anchor="middle" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="1">QUIPPY PRACTICE ROOM</text>
  </g>

  <!-- Bottom Quote Banner -->
  <text x="600" y="565" text-anchor="middle" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400" letter-spacing="0.3">"Practising difficult conversations, together."</text>
</svg>
